# Use with the root docker-compose.yml on a Linux Docker host.
services:
  postgres:
    ports: !reset []
    networks:
      default:
      colab_access:
        ipv4_address: ${COLAB_NETWORK_PREFIX:-10.243.17}.10

  rabbitmq:
    ports: !reset []
    networks:
      default:
      colab_access:
        ipv4_address: ${COLAB_NETWORK_PREFIX:-10.243.17}.11

  backend:
    ports: !reset []
    networks:
      default:
      colab_access:
        ipv4_address: ${COLAB_NETWORK_PREFIX:-10.243.17}.12

  minio:
    ports: !reset []
    networks:
      default:
      colab_access:
        ipv4_address: ${COLAB_NETWORK_PREFIX:-10.243.17}.13

networks:
  colab_access:
    driver: bridge
    ipam:
      config:
        - subnet: ${COLAB_NETWORK_PREFIX:-10.243.17}.0/24
