name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  detect:
    name: Detect components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.components.outputs.backend }}
      frontend: ${{ steps.components.outputs.frontend }}
      ai_service: ${{ steps.components.outputs.ai_service }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Detect component manifests
        id: components
        run: |
          for component in backend frontend ai_service; do
            case "$component" in
              backend) manifest=backend/go.mod ;;
              frontend) manifest=frontend/package.json ;;
              ai_service) manifest=ai-service/pyproject.toml ;;
            esac

            if [[ -f "$manifest" ]]; then
              echo "$component=true" >> "$GITHUB_OUTPUT"
              echo "- $component: enabled" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$component=false" >> "$GITHUB_OUTPUT"
              echo "- $component: skipped (no $manifest)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color

      - name: Validate frontend CI script syntax
        run: node --check .github/scripts/frontend-ci.cjs

      - name: Test frontend CI error handling
        run: node --test .github/scripts/frontend-ci.test.cjs

  backend:
    name: Backend checks
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/university_test?sslmode=disable
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: university_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d university_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify
          go mod tidy -diff

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            echo 'Run gofmt on the files above.'
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...

      - name: Unit and PostgreSQL integration tests
        run: go test -race -count=1 -timeout 3m -cover ./...

      - name: Build
        run: go build ./...

  frontend:
    name: Frontend checks
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies and run available checks
        run: node .github/scripts/frontend-ci.cjs

  ai_service:
    name: AI service checks
    needs: detect
    if: needs.detect.outputs.ai_service == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai-service
    env:
      TEST_RABBITMQ_URL: amqp://university:university@localhost:5672/
    services:
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: university
          RABBITMQ_DEFAULT_PASS: university
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml

      - name: Install test dependencies
        run: python -m pip install '.[dev]'

      - name: Lint Python
        run: ruff check .

      - name: Unit and RabbitMQ integration tests
        run: python -m pytest -q

  result:
    name: CI result
    if: always()
    needs: [detect, workflows, backend, frontend, ai_service]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DETECT_RESULT: ${{ needs.detect.result }}
      WORKFLOWS_RESULT: ${{ needs.workflows.result }}
      BACKEND_RESULT: ${{ needs.backend.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      AI_SERVICE_RESULT: ${{ needs.ai_service.result }}
    steps:
      - name: Check required job results
        run: |
          [[ "$DETECT_RESULT" == success ]]
          [[ "$WORKFLOWS_RESULT" == success ]]

          for result in "$BACKEND_RESULT" "$FRONTEND_RESULT" "$AI_SERVICE_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
