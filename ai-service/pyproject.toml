[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "university-ai-service"
version = "0.1.0"
description = "RabbitMQ worker using Qwen3 through OpenRouter, hosted by FastAPI"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.5,<10",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "minio>=7.2,<8",
    "pydantic-settings>=2.7,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*", "tools"]

[tool.setuptools.package-data]
"app.migrations" = ["*.sql", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires a real RabbitMQ instance"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
